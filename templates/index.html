<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Based Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .exam-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .question-box {
            background-color: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .recording-indicator {
            display: none;
            color: #dc3545;
            font-weight: bold;
        }
        .feedback-box {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
        }
        .recording-visualizer {
            width: 100%;
            height: 50px;
            background-color: #f8f9fa;
            margin: 1rem 0;
            display: none;
        }
        .audio-player {
            width: 100%;
            margin: 1rem 0;
        }
        .recording-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .voice-instruction {
            background-color: #e9ecef;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container exam-container">
        <h1 class="text-center mb-4">Voice-Based Exam System</h1>
        
        <div id="login-section" class="mb-4">
            <div class="mb-3">
                <label for="candidate-id" class="form-label">Enter your Candidate ID:</label>
                <input type="text" class="form-control" id="candidate-id" required>
            </div>
            <button class="btn btn-primary" onclick="startExam()">Start Exam</button>
        </div>

        <div id="exam-section" style="display: none;">
            <div class="question-box">
                <h4>Question:</h4>
                <p id="question-text"></p>
            </div>

            <div class="voice-instruction">
                <h5>Instructions:</h5>
                <p>Click "Start Recording" and speak your answer clearly. You can record for up to 2 minutes. Click "Stop Recording" when you're done.</p>
            </div>

            <div class="recording-visualizer" id="recording-visualizer">
                <canvas id="visualizer" width="100%" height="50"></canvas>
            </div>

            <div class="mb-3">
                <button class="btn btn-primary" onclick="startRecording()" id="start-btn">Start Recording</button>
                <button class="btn btn-danger" onclick="stopRecording()" id="stop-btn" disabled>Stop Recording</button>
                <span class="recording-indicator">Recording... <i class="fas fa-microphone"></i></span>
            </div>

            <div class="audio-player" id="audio-player" style="display: none;">
                <h5>Your Answer:</h5>
                <audio id="playback" controls></audio>
            </div>

            <div class="feedback-box" id="feedback-section" style="display: none;">
                <h5>Feedback:</h5>
                <p id="feedback-text"></p>
                <p id="similarity-score"></p>
            </div>

            <button class="btn btn-success" onclick="nextQuestion()" id="next-btn" style="display: none;">Next Question</button>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let currentQuestionId = null;
        let audioContext;
        let analyser;
        let canvasContext;
        let animationFrame;

        async function startExam() {
            const candidateId = document.getElementById('candidate-id').value;
            if (!candidateId) {
                alert('Please enter your Candidate ID');
                return;
            }

            const response = await fetch('/start_exam', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `candidate_id=${candidateId}`
            });

            if (response.ok) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('exam-section').style.display = 'block';
                getNextQuestion();
            }
        }

        async function getNextQuestion() {
            const response = await fetch('/get_question');
            const data = await response.json();
            document.getElementById('question-text').textContent = data.question_text;
            currentQuestionId = data.question_id;
            
            // Reset UI elements
            document.getElementById('audio-player').style.display = 'none';
            document.getElementById('feedback-section').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
        }

        function setupAudioVisualizer() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            
            const canvas = document.getElementById('visualizer');
            canvasContext = canvas.getContext('2d');
            
            function draw() {
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);
                
                canvasContext.fillStyle = 'rgb(200, 200, 200)';
                canvasContext.fillRect(0, 0, canvas.width, canvas.height);
                
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;
                
                for(let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i];
                    
                    canvasContext.fillStyle = 'rgb(' + (barHeight+100) + ',50,50)';
                    canvasContext.fillRect(x, canvas.height-barHeight/2, barWidth, barHeight/2);
                    
                    x += barWidth + 1;
                }
                
                animationFrame = requestAnimationFrame(draw);
            }
            
            draw();
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                // Setup audio visualizer
                setupAudioVisualizer();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    cancelAnimationFrame(animationFrame);
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const playback = document.getElementById('playback');
                    playback.src = audioUrl;
                    document.getElementById('audio-player').style.display = 'block';
                    await submitAnswer(audioBlob);
                };

                mediaRecorder.start();
                document.querySelector('.recording-indicator').style.display = 'inline';
                document.getElementById('recording-visualizer').style.display = 'block';
                document.getElementById('start-btn').disabled = true;
                document.getElementById('stop-btn').disabled = false;
                
                // Auto-stop after 2 minutes
                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        stopRecording();
                    }
                }, 120000);
            } catch (err) {
                console.error('Error accessing microphone:', err);
                alert('Error accessing microphone. Please ensure you have granted microphone permissions.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                document.querySelector('.recording-indicator').style.display = 'none';
                document.getElementById('recording-visualizer').style.display = 'none';
                document.getElementById('start-btn').disabled = false;
                document.getElementById('stop-btn').disabled = true;
            }
        }

        async function submitAnswer(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob);
                formData.append('question_id', currentQuestionId);

                const response = await fetch('/process_answer', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json();
                document.getElementById('feedback-section').style.display = 'block';
                document.getElementById('feedback-text').textContent = result.feedback;
                document.getElementById('similarity-score').textContent = `Similarity Score: ${(result.similarity_score * 100).toFixed(2)}%`;
                document.getElementById('next-btn').style.display = 'block';
            } catch (error) {
                console.error('Error submitting answer:', error);
                alert('There was an error processing your answer. Please try again.');
            }
        }

        function nextQuestion() {
            document.getElementById('feedback-section').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            getNextQuestion();
        }
    </script>
</body>
</html>
